<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Demo TH9 — Eureka + Pricing</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; background:#f7f7fb; color:#222; }
  h1 { font-size: 22px; }
  .card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:16px; margin:16px 0; max-width:860px; }
  button { padding:8px 14px; border:0; border-radius:6px; background:#007bff; color:#fff; cursor:pointer; }
  button:hover { background:#0056b3; }
  table { border-collapse: collapse; width:100%; margin-top:12px; }
  th,td { border:1px solid #ccc; padding:8px; text-align:left; }
  th { background:#f0f0f0; }
  .up { color:green; font-weight:bold; }
  pre { background:#111; color:#0f0; padding:12px; border-radius:6px; overflow:auto; }
  label { display:inline-block; margin:4px 8px 4px 0; }
  input, select { padding:6px; margin:2px 6px 2px 0; }
</style>
</head>
<body>
<h1>🎉 Demo Bài TH9 — Triển khai hệ thống</h1>
<p>Chức năng 1: Eureka Service Registry &nbsp;|&nbsp; Chức năng 2: Pricing Service (tính giá bảo hiểm)</p>

<div class="card">
  <h3>Chức năng 1 — Eureka Registry (8761)</h3>
  <button onclick="loadEureka()">🔄 Lấy danh sách service từ Eureka</button>
  <div id="eureka"></div>
  <p>Mở dashboard: <a href="http://localhost:8761" target="_blank">http://localhost:8761</a></p>
</div>

<div class="card">
  <h3>Chức năng 2 — Pricing Service (5053)</h3>
  <label>ProductCode: <input id="product" value="TRI"></label>
  <label>Số người lớn: <input id="adults" type="number" value="1" min="1"></label>
  <label>Số trẻ em: <input id="children" type="number" value="1" min="0"></label>
  <label>Destination:
    <select id="dest"><option value="EUR">EUR</option><option value="WORLD">WORLD</option></select>
  </label>
  <button onclick="calcPrice()">💰 Tính giá</button>
  <pre id="priceOut">Chưa có kết quả. (Kết quả mẫu trước: totalPrice 98.00)</pre>
</div>

<script>
async function loadEureka() {
  const el = document.getElementById('eureka');
  el.innerHTML = 'Đang tải...';
  try {
    const r = await fetch('http://localhost:8761/eureka/apps');
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<p>Chưa có service nào, hãy khởi động EurekaServer + PricingService.</p>'; return; }
    let rows = '';
    data.forEach(app => (app.instance||[]).forEach(i => {
      rows += `<tr><td>${app.name}</td><td>${i.instanceId}</td><td>${i.hostName}</td><td>${i.port}</td><td class="up">${i.status}</td></tr>`;
    }));
    el.innerHTML = `<table><tr><th>Application</th><th>Instance ID</th><th>Host</th><th>Port</th><th>Status</th></tr>${rows}</table>`;
  } catch(e) {
    el.innerHTML = '<p style="color:red">Lỗi kết nối Eureka. Hãy mở EurekaServer trước (dotnet run --project ./EurekaServer).</p>';
  }
}
async function calcPrice() {
  const body = {
    productCode: document.getElementById('product').value,
    policyFrom: '2026-11-08T00:00:00+07:00',
    policyTo: '2026-11-13T00:00:00+07:00',
    selectedCovers: ['C1','C2','C3'],
    answers: [
      {questionCode:'NUM_OF_ADULTS', questionType:'Number', answer:Number(document.getElementById('adults').value)},
      {questionCode:'NUM_OF_CHILDREN', questionType:'Number', answer:Number(document.getElementById('children').value)},
      {questionCode:'DESTINATION', questionType:'Text', answer:document.getElementById('dest').value}
    ]
  };
  const out = document.getElementById('priceOut');
  out.textContent = 'Đang tính...';
  try {
    const r = await fetch('http://localhost:5053/api/Pricing', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    out.textContent = JSON.stringify(j, null, 2);
  } catch(e) {
    out.textContent = 'Lỗi kết nối PricingService. Hãy mở PricingService trước (dotnet run --project ./PricingService).';
  }
}
loadEureka();
</script>
</body>
</html>
